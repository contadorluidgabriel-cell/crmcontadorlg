name: CRM CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Domain smoke tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: crm-v232-preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
